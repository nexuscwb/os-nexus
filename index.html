<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nexus OS</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #111; color: #fff; }
    .hidden { display: none; }
    input, select, button { margin: 5px; padding: 5px; }
    li { background: #222; margin: 5px 0; padding: 10px; border-radius: 5px; }
  </style>
</head>
<body>

  <div id="loginSection">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="E-mail" value="admin@nexus.com"><br>
    <input type="password" id="password" placeholder="Senha" value="segredo123"><br>
    <button onclick="login()">Entrar</button>
    <button onclick="resetarSenha()">Esqueci a senha</button>
  </div>

  <div id="appSection" class="hidden">
    <button onclick="logout()">Sair</button>
    <h2>Ordem de Serviço</h2>

    <form id="formOS">
      <input type="hidden" id="osId">
      <input type="text" id="cliente" placeholder="Cliente"><br>
      <input type="text" id="descricao" placeholder="Descrição"><br>
      <input type="text" id="tecnico" placeholder="Técnico"><br>
      <select id="status">
        <option value="pendente">Pendente</option>
        <option value="em_andamento">Em andamento</option>
        <option value="concluida">Concluída</option>
      </select><br>
      <button type="button" onclick="salvarOuAtualizarOrdem()">Salvar</button>
    </form>

    <h3>Filtros</h3>
    <input type="text" id="filtroTecnico" placeholder="Filtrar por técnico" oninput="atualizarLista()">
    <select id="filtroStatus" onchange="atualizarLista()">
      <option value="">Todos</option>
      <option value="pendente">Pendente</option>
      <option value="em_andamento">Em andamento</option>
      <option value="concluida">Concluída</option>
      <option value="cancelado">Cancelado</option>
      <option value="entregue">Entregue</option>
    </select>

    <ul id="listaOrdens"></ul>
  </div>

  <!-- Firebase scripts v8 (compatível com GitHub Pages) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDl44w_xRjnOO3yz7zs0HeBTTfeifGIoP8",
      authDomain: "database-nexus.firebaseapp.com",
      databaseURL: "https://database-nexus-default-rtdb.firebaseio.com",
      projectId: "database-nexus",
      storageBucket: "database-nexus.appspot.com",
      messagingSenderId: "1023176085014",
      appId: "1:1023176085014:web:ce58a963e9cb5298012f37",
      measurementId: "G-KXFVK6PD48"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let usuarioId = null;
    let emailUsuario = null;
    let isAdmin = false;

    auth.onAuthStateChanged(user => {
      if (user) {
        usuarioId = user.uid;
        emailUsuario = user.email;
        isAdmin = emailUsuario.endsWith("@nexus.com") || emailUsuario === "admin@nexus.com";
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        document.getElementById('formOS').style.display = isAdmin ? 'block' : 'none';
        atualizarLista();
      } else {
        usuarioId = null;
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('appSection').classList.add('hidden');
      }
    });

    function login() {
      const email = document.getElementById('email').value;
      const senha = document.getElementById('password').value;
      auth.signInWithEmailAndPassword(email, senha)
        .catch(error => alert("Erro no login: " + JSON.stringify(error)));
    }

    function resetarSenha() {
      const email = document.getElementById('email').value;
      if (!email) return alert("Digite o e-mail para redefinir.");
      auth.sendPasswordResetEmail(email)
        .then(() => alert("E-mail enviado."))
        .catch(error => alert("Erro: " + error.message));
    }

    function logout() {
      auth.signOut();
    }

    function salvarOuAtualizarOrdem() {
      const id = document.getElementById("osId").value;
      const dadosOS = {
        cliente: document.getElementById("cliente").value,
        descricao: document.getElementById("descricao").value,
        tecnico: document.getElementById("tecnico").value,
        status: document.getElementById("status").value,
        data: new Date().toLocaleString(),
        usuario: usuarioId
      };

      if (id) {
        db.ref("ordens/" + id).update(dadosOS);
      } else {
        db.ref("ordens").push(dadosOS);
      }

      document.getElementById("formOS").reset();
      atualizarLista();
    }

    function atualizarLista() {
      const tecnicoFiltro = document.getElementById("filtroTecnico").value.toLowerCase();
      const statusFiltro = document.getElementById("filtroStatus").value;
      const lista = document.getElementById("listaOrdens");
      lista.innerHTML = "";

      db.ref("ordens").once("value", snapshot => {
        snapshot.forEach(child => {
          const os = child.val();
          const key = child.key;
          if (
            (tecnicoFiltro === '' || os.tecnico.toLowerCase().includes(tecnicoFiltro)) &&
            (statusFiltro === '' || os.status === statusFiltro)
          ) {
            const li = document.createElement("li");
            li.innerHTML = `
              <strong>${os.cliente}</strong> (${os.tecnico})<br>
              ${os.descricao}<br>
              <em>${os.data} - ${os.status}</em><br>
              ${isAdmin ?
                `<button onclick="editarOrdem('${key}', ${JSON.stringify(os).replace(/"/g, '&quot;')})">Editar</button>
                 <button onclick="excluirOrdem('${key}')">Excluir</button>` :
                `<button onclick="editarOrdem('${key}', ${JSON.stringify(os).replace(/"/g, '&quot;')})">Preencher Observações</button>`}
            `;
            lista.appendChild(li);
          }
        });
      });
    }

    function editarOrdem(id, os) {
      document.getElementById("osId").value = id;
      document.getElementById("cliente").value = os.cliente;
      document.getElementById("descricao").value = os.descricao;
      document.getElementById("tecnico").value = os.tecnico;
      document.getElementById("status").value = os.status;

      const statusSelect = document.getElementById("status");
      if (!isAdmin) {
        document.getElementById("cliente").disabled = true;
        document.getElementById("tecnico").disabled = true;
        document.getElementById("descricao").disabled = false;
        statusSelect.innerHTML = `
          <option value="cancelado">Cancelado</option>
          <option value="entregue">Entregue</option>`;
      } else {
        document.getElementById("cliente").disabled = false;
        document.getElementById("tecnico").disabled = false;
        document.getElementById("descricao").disabled = false;
        statusSelect.innerHTML = `
          <option value="pendente">Pendente</option>
          <option value="em_andamento">Em andamento</option>
          <option value="concluida">Concluída</option>`;
      }
    }

    function excluirOrdem(id) {
      if (isAdmin && confirm("Deseja excluir esta ordem?")) {
        db.ref("ordens/" + id).remove();
        atualizarLista();
      }
    }
  </script>

</body>
</html>
