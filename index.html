<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - Nexus OS</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
    }
    .login-box {
      background: white;
      padding: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 8px;
      text-align: center;
      width: 300px;
    }
    input {
      margin: 10px 0;
      padding: 10px;
      width: 100%;
      font-size: 16px;
    }
    button {
      padding: 10px;
      width: 100%;
      background: #0056b3;
      color: white;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #003366;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login Nexus </h2>
    <input type="password" id="senha" placeholder="Digite a senha" />
    <button onclick="entrar()">Entrar</button>
    <p id="erro" style="color:red;"></p>
  </div>

  <script>
    function entrar() {
      const senha = document.getElementById('senha').value;
      const senhaCorreta = 'nexus@2025123';
      if (senha === senhaCorreta) {
        window.location.href = 'app.html';
      } else {
        document.getElementById('erro').textContent = 'Senha incorreta';
      }
    }
  </script>
</body>
</html>
