<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sistema OS - Nexus</title>
  <link rel="icon" type="image/jpeg" href="logo-nexus.jpg">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <style>
    body { font-family: Arial; background: #f5f5f5; padding: 20px; }
    .hidden { display: none; }
    .section { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px #ccc; }
    h2 { color: #003366; border-bottom: 2px solid #0056b3; padding-bottom: 5px; }
    input, select, textarea, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
    button { background: #0056b3; color: white; border: none; cursor: pointer; }
    button:hover { background: #003366; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background: #0056b3; color: white; }
    .btn-group { display: flex; gap: 10px; margin-top: 10px; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginSection" class="section">
  <img src="logo-nexus.jpg" alt="Logo" style="width: 120px; display:block; margin:auto;">
  <h2 style="text-align:center;">Login Nexus OS</h2>
  <input type="email" id="email" placeholder="E-mail" value="admin@nexus.com">
  <input type="password" id="password" placeholder="Senha" value="segredo123">
  <button onclick="login()">Entrar</button>
  <button onclick="resetarSenha()" style="background:#ccc;color:#333;">Esqueci a senha</button>
</div>

<!-- APP PRINCIPAL -->
<div id="appSection" class="hidden">

  <!-- Importação/Exportação (somente admin) -->
  <div id="importExportSection" class="section hidden">
    <h2>Importação e Exportação</h2>
    <input type="file" accept=".csv" id="importCSV" onchange="importarCSV()">
    <button onclick="exportarCSV()">Exportar CSV</button>
  </div>

  <!-- Painel de Usuários -->
  <div id="painelUsuarios" class="section hidden">
    <h2>Cadastro de Usuários</h2>
    <input type="email" id="novoEmail" placeholder="E-mail">
    <input type="password" id="novaSenha" placeholder="Senha">
    <select id="nivelAcesso">
      <option value="tecnico">Técnico</option>
      <option value="admin">Administrador</option>
    </select>
    <button onclick="criarUsuario()">Criar Usuário</button>
  </div>

  <!-- Cadastro de OS -->
  <div class="section">
    <h2>Cadastro de Ordem de Serviço</h2>
    <div class="btn-group">
      <input type="text" id="dataAgendamento" placeholder="Data Agendamento">
      <select id="periodo"><option>Manhã</option><option>Tarde</option></select>
    </div>
    <input type="text" id="nomeCliente" placeholder="Nome do Cliente">
    <input type="text" id="endereco" placeholder="Endereço">
    <div class="btn-group">
      <input type="text" id="dataFinalizacao" placeholder="Data Finalização">
      <select id="atividade">
        <option value="">Atividade</option>
        <option>MIGRAÇÃO</option><option>INSTALAÇÃO</option><option>MANUTENÇÃO</option><option>RETIRADA</option><option>VT</option>
      </select>
      <select id="status">
        <option value="">Status</option>
        <option>ENTREGUE</option><option>CANCELADO</option><option>AGUARDANDO</option>
      </select>
    </div>
    <textarea id="observacao" placeholder="Observações"></textarea>
    <button onclick="salvarOS()">Salvar OS</button>
  </div>

  <!-- Filtros -->
  <div class="section">
    <h2>Filtros</h2>
    <div class="btn-group">
      <input type="text" id="filtroNome" placeholder="Filtrar por Cliente" onkeyup="carregarTabela()">
      <input type="text" id="filtroEndereco" placeholder="Filtrar por Endereço" onkeyup="carregarTabela()">
    </div>
    <div class="btn-group">
      <input type="text" id="filtroDataInicio" placeholder="Data Início" onchange="carregarTabela()">
      <input type="text" id="filtroDataFim" placeholder="Data Fim" onchange="carregarTabela()">
      <select id="filtroStatus" onchange="carregarTabela()">
        <option value="">Todos Status</option><option>ENTREGUE</option><option>CANCELADO</option><option>AGUARDANDO</option>
      </select>
    </div>
  </div>

  <!-- Métricas -->
  <div class="section" id="metricas">
    <h2>Métricas</h2>
    <p><strong>Total:</strong> <span id="totalOS">0</span> | 
       <strong>Entregues:</strong> <span id="entregues">0</span> | 
       <strong>Canceladas:</strong> <span id="canceladas">0</span> | 
       <strong>Aguardando:</strong> <span id="aguardando">0</span></p>
  </div>

  <!-- Tabela -->
  <div class="section">
    <h2>Ordens de Serviço</h2>
    <table id="tabelaOS">
      <thead>
        <tr><th>Data</th><th>Cliente</th><th>Endereço</th><th>Status</th><th>Ações</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<script>
  // Configuração do Firebase
  const firebaseConfig = {
    apiKey: "SUA_API_KEY",
    authDomain: "SEU_PROJETO.firebaseapp.com",
    databaseURL: "https://SEU_PROJETO.firebaseio.com",
    projectId: "SEU_PROJETO",
    storageBucket: "SEU_PROJETO.appspot.com",
    messagingSenderId: "SEU_SENDER_ID",
    appId: "SEU_APP_ID"
  };

  // Inicializar Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Variável global para usuário logado
  let currentUser = null;

  // Função de Login
  function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    firebase.auth().signInWithEmailAndPassword(email, password)
      .then((userCredential) => {
        currentUser = userCredential.user;
        
        // Verificar nível de acesso
        db.ref('users/' + currentUser.uid).once('value').then((snapshot) => {
          const userData = snapshot.val();
          
          // Mostrar app principal
          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('appSection').classList.remove('hidden');
          
          // Se for admin, mostrar painéis especiais
          if (userData && userData.nivelAcesso === 'admin') {
            document.getElementById('painelUsuarios').classList.remove('hidden');
            document.getElementById('importExportSection').classList.remove('hidden');
          }
          
          // Carregar dados iniciais
          carregarTabela();
          atualizarMetricas();
        });
      })
      .catch((error) => {
        alert('Erro ao fazer login: ' + error.message);
      });
  }

  // Função para resetar senha
  function resetarSenha() {
    const email = document.getElementById('email').value;
    if (!email) {
      alert('Digite seu e-mail para redefinir a senha');
      return;
    }
    
    firebase.auth().sendPasswordResetEmail(email)
      .then(() => alert('E-mail de redefinição enviado!'))
      .catch(error => alert('Erro: ' + error.message));
  }

  // Função para criar usuário (somente admin)
  function criarUsuario() {
    if (!currentUser) return;
    
    const email = document.getElementById('novoEmail').value;
    const password = document.getElementById('novaSenha').value;
    const nivelAcesso = document.getElementById('nivelAcesso').value;
    
    if (!email || !password) {
      alert('Preencha todos os campos!');
      return;
    }
    
    firebase.auth().createUserWithEmailAndPassword(email, password)
      .then((userCredential) => {
        const newUser = userCredential.user;
        
        // Salvar informações adicionais no banco de dados
        return db.ref('users/' + newUser.uid).set({
          email: email,
          nivelAcesso: nivelAcesso,
          criadoEm: firebase.database.ServerValue.TIMESTAMP
        });
      })
      .then(() => {
        alert('Usuário criado com sucesso!');
        document.getElementById('novoEmail').value = '';
        document.getElementById('novaSenha').value = '';
      })
      .catch(error => alert('Erro ao criar usuário: ' + error.message));
  }

  // Função para salvar OS
  function salvarOS() {
    if (!currentUser) return;
    
    const osData = {
      dataAgendamento: document.getElementById('dataAgendamento').value,
      periodo: document.getElementById('periodo').value,
      nomeCliente: document.getElementById('nomeCliente').value,
      endereco: document.getElementById('endereco').value,
      dataFinalizacao: document.getElementById('dataFinalizacao').value,
      atividade: document.getElementById('atividade').value,
      status: document.getElementById('status').value,
      observacao: document.getElementById('observacao').value,
      criadoPor: currentUser.uid,
      criadoEm: firebase.database.ServerValue.TIMESTAMP
    };
    
    if (!osData.nomeCliente || !osData.endereco) {
      alert('Preencha pelo menos Nome do Cliente e Endereço!');
      return;
    }
    
    db.ref('ordens-servico').push(osData)
      .then(() => {
        alert('OS salva com sucesso!');
        limparFormularioOS();
        carregarTabela();
        atualizarMetricas();
      })
      .catch(error => alert('Erro ao salvar OS: ' + error.message));
  }

  // Limpar formulário de OS
  function limparFormularioOS() {
    document.getElementById('dataAgendamento').value = '';
    document.getElementById('periodo').value = 'Manhã';
    document.getElementById('nomeCliente').value = '';
    document.getElementById('endereco').value = '';
    document.getElementById('dataFinalizacao').value = '';
    document.getElementById('atividade').value = '';
    document.getElementById('status').value = '';
    document.getElementById('observacao').value = '';
  }

  // Carregar tabela de OS
  function carregarTabela() {
    const tabela = document.getElementById('tabelaOS').getElementsByTagName('tbody')[0];
    tabela.innerHTML = '';
    
    let ref = db.ref('ordens-servico');
    
    // Aplicar filtros
    const filtroNome = document.getElementById('filtroNome').value.toLowerCase();
    const filtroEndereco = document.getElementById('filtroEndereco').value.toLowerCase();
    const filtroStatus = document.getElementById('filtroStatus').value;
    const filtroDataInicio = document.getElementById('filtroDataInicio').value;
    const filtroDataFim = document.getElementById('filtroDataFim').value;
    
    ref.once('value').then((snapshot) => {
      const osList = [];
      snapshot.forEach((childSnapshot) => {
        const os = childSnapshot.val();
        os.id = childSnapshot.key;
        osList.push(os);
      });
      
      // Ordenar por data (mais recente primeiro)
      osList.sort((a, b) => b.criadoEm - a.criadoEm);
      
      // Filtrar e exibir
      osList.forEach((os) => {
        // Aplicar filtros
        if (filtroNome && !os.nomeCliente.toLowerCase().includes(filtroNome)) return;
        if (filtroEndereco && !os.endereco.toLowerCase().includes(filtroEndereco)) return;
        if (filtroStatus && os.status !== filtroStatus) return;
        if (filtroDataInicio && os.dataAgendamento < filtroDataInicio) return;
        if (filtroDataFim && os.dataAgendamento > filtroDataFim) return;
        
        const row = tabela.insertRow();
        
        row.insertCell(0).textContent = os.dataAgendamento || '-';
        row.insertCell(1).textContent = os.nomeCliente;
        row.insertCell(2).textContent = os.endereco;
        row.insertCell(3).textContent = os.status || 'AGUARDANDO';
        
        // Botões de ação
        const actionsCell = row.insertCell(4);
        actionsCell.innerHTML = `
          <button onclick="editarOS('${os.id}')" style="padding:5px;margin:2px;">Editar</button>
          <button onclick="excluirOS('${os.id}')" style="padding:5px;margin:2px;background:#dc3545;">Excluir</button>
        `;
      });
    });
  }

  // Editar OS
  function editarOS(osId) {
    db.ref('ordens-servico/' + osId).once('value').then((snapshot) => {
      const os = snapshot.val();
      
      document.getElementById('dataAgendamento').value = os.dataAgendamento || '';
      document.getElementById('periodo').value = os.periodo || 'Manhã';
      document.getElementById('nomeCliente').value = os.nomeCliente || '';
      document.getElementById('endereco').value = os.endereco || '';
      document.getElementById('dataFinalizacao').value = os.dataFinalizacao || '';
      document.getElementById('atividade').value = os.atividade || '';
      document.getElementById('status').value = os.status || '';
      document.getElementById('observacao').value = os.observacao || '';
      
      // Scroll para o formulário
      document.querySelector('.section').scrollIntoView({ behavior: 'smooth' });
    });
  }

  // Excluir OS
  function excluirOS(osId) {
    if (confirm('Tem certeza que deseja excluir esta OS?')) {
      db.ref('ordens-servico/' + osId).remove()
        .then(() => {
          alert('OS excluída com sucesso!');
          carregarTabela();
          atualizarMetricas();
        })
        .catch(error => alert('Erro ao excluir OS: ' + error.message));
    }
  }

  // Atualizar métricas
  function atualizarMetricas() {
    db.ref('ordens-servico').once('value').then((snapshot) => {
      let total = 0, entregues = 0, canceladas = 0, aguardando = 0;
      
      snapshot.forEach((childSnapshot) => {
        total++;
        const status = childSnapshot.val().status;
        
        if (status === 'ENTREGUE') entregues++;
        else if (status === 'CANCELADO') canceladas++;
        else aguardando++;
      });
      
      document.getElementById('totalOS').textContent = total;
      document.getElementById('entregues').textContent = entregues;
      document.getElementById('canceladas').textContent = canceladas;
      document.getElementById('aguardando').textContent = aguardando;
    });
  }

  // Importar CSV
  function importarCSV() {
    const fileInput = document.getElementById('importCSV');
    const file = fileInput.files[0];
    
    if (!file) {
      alert('Nenhum arquivo selecionado!');
      return;
    }

    const reader = new FileReader();
    
    reader.onload = function(e) {
      const contents = e.target.result;
      const lines = contents.split('\n');
      const headers = lines[0].split(';');
      
      // Verificar cabeçalho do CSV
      const expectedHeaders = ['dataAgendamento', 'periodo', 'nomeCliente', 'endereco', 
                             'dataFinalizacao', 'atividade', 'status', 'observacao'];
      
      if (headers.length !== expectedHeaders.length || !headers.every((h, i) => h.trim() === expectedHeaders[i])) {
        alert('Formato do CSV inválido! Verifique o cabeçalho.');
        return;
      }

      // Processar cada linha do CSV (ignorando o cabeçalho)
      const osRef = db.ref('ordens-servico');
      let importedCount = 0;
      let errorCount = 0;

      for (let i = 1; i < lines.length; i++) {
        if (lines[i].trim() === '') continue;
        
        const values = lines[i].split(';');
        if (values.length !== headers.length) {
          errorCount++;
          continue;
        }

        const osData = {
          dataAgendamento: values[0].trim(),
          periodo: values[1].trim(),
          nomeCliente: values[2].trim(),
          endereco: values[3].trim(),
          dataFinalizacao: values[4].trim(),
          atividade: values[5].trim(),
          status: values[6].trim(),
          observacao: values[7].trim(),
          criadoPor: currentUser.uid,
          criadoEm: firebase.database.ServerValue.TIMESTAMP
        };

        osRef.push(osData)
          .then(() => importedCount++)
          .catch(() => errorCount++);
      }

      // Mostrar resultado após processar todas as linhas
      setTimeout(() => {
        alert(`Importação concluída!\n${importedCount} OS importadas com sucesso.\n${errorCount} falhas.`);
        carregarTabela();
        atualizarMetricas();
        fileInput.value = ''; // Limpar seleção de arquivo
      }, 1000);
    };
    
    reader.onerror = function() {
      alert('Erro ao ler o arquivo!');
    };
    
    reader.readAsText(file);
  }

  // Exportar CSV
  function exportarCSV() {
    db.ref('ordens-servico').once('value').then((snapshot) => {
      const data = snapshot.val();
      if (!data) {
        alert('Nenhuma OS encontrada para exportar!');
        return;
      }

      // Criar cabeçalho do CSV
      let csvContent = 'dataAgendamento;periodo;nomeCliente;endereco;dataFinalizacao;atividade;status;observacao\n';
      
      // Adicionar cada OS como uma linha no CSV
      Object.keys(data).forEach((key) => {
        const os = data[key];
        csvContent += [
          os.dataAgendamento || '',
          os.periodo || '',
          os.nomeCliente || '',
          os.endereco || '',
          os.dataFinalizacao || '',
          os.atividade || '',
          os.status || '',
          os.observacao ? os.observacao.replace(/\n/g, ' ') : ''
        ].join(';') + '\n';
      });

      // Criar e baixar o arquivo
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      
      link.setAttribute('href', url);
      link.setAttribute('download', `OS_Nexus_${new Date().toISOString().split('T')[0]}.csv`);
      link.style.visibility = 'hidden';
      
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  }

  // Verificar autenticação ao carregar a página
  firebase.auth().onAuthStateChanged((user) => {
    if (user) {
      currentUser = user;
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('appSection').classList.remove('hidden');
      
      // Verificar se é admin
      db.ref('users/' + user.uid).once('value').then((snapshot) => {
        const userData = snapshot.val();
        if (userData && userData.nivelAcesso === 'admin') {
          document.getElementById('painelUsuarios').classList.remove('hidden');
          document.getElementById('importExportSection').classList.remove('hidden');
        }
        
        carregarTabela();
        atualizarMetricas();
      });
    }
  });
</script>

</body>
</html>
