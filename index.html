<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OS Nexus com Firebase</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    label { display: block; margin-top: 10px; }
    input, textarea, select { width: 100%; padding: 8px; margin-top: 4px; }
    button { margin-top: 15px; padding: 10px 20px; }
    ul { margin-top: 30px; padding: 0; list-style-type: none; }
    li { background: #f0f0f0; margin-bottom: 10px; padding: 10px; border-radius: 6px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Ordem de Serviço - Nexus</h1>

  <div id="loginSection">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Senha" required />
    <button onclick="login()">Entrar</button>
  </div>

  <div id="appSection" class="hidden">
    <button onclick="logout()">Sair</button>

    <h2>Nova Ordem</h2>
    <form id="formOS" onsubmit="event.preventDefault(); salvarOuAtualizarOrdem();">
      <input type="hidden" id="osId" />

      <label for="cliente">Cliente:</label>
      <input type="text" id="cliente" required />

      <label for="descricao">Descrição:</label>
      <textarea id="descricao" required></textarea>

      <label for="tecnico">Técnico:</label>
      <input type="text" id="tecnico" required />

      <label for="status">Status:</label>
      <select id="status">
        <option value="pendente">Pendente</option>
        <option value="em_andamento">Em andamento</option>
        <option value="concluida">Concluída</option>
      </select>

      <button type="submit">Salvar</button>
    </form>

    <h2>Filtros</h2>
    <input type="text" id="filtroTecnico" placeholder="Filtrar por técnico" oninput="atualizarLista()" />
    <select id="filtroStatus" onchange="atualizarLista()">
      <option value="">Todos os status</option>
      <option value="pendente">Pendente</option>
      <option value="em_andamento">Em andamento</option>
      <option value="concluida">Concluída</option>
    </select>

    <h2>Ordens</h2>
    <ul id="listaOrdens"></ul>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-database.js"></script>

  <script>
    // Configuração Firebase atualizada
    const firebaseConfig = {
      apiKey: "AIzaSyDl44w_xRjnOO3yz7zs0HeBTTfeifGIoP8",
      authDomain: "database-nexus.firebaseapp.com",
      databaseURL: "https://database-nexus-default-rtdb.firebaseio.com",
      projectId: "database-nexus",
      storageBucket: "database-nexus.appspot.com",
      messagingSenderId: "",
      appId: ""
    };

    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let usuarioId = null;

    auth.onAuthStateChanged(user => {
      if (user) {
        usuarioId = user.uid;
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        atualizarLista();
      } else {
        usuarioId = null;
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('appSection').classList.add('hidden');
      }
    });

    function login() {
      const email = document.getElementById('email').value;
      const senha = document.getElementById('password').value;
      auth.signInWithEmailAndPassword(email, senha).catch(alert);
    }

    function logout() {
      auth.signOut();
    }

    function salvarOuAtualizarOrdem() {
      const id = document.getElementById("osId").value;
      const dadosOS = {
        cliente: document.getElementById("cliente").value,
        descricao: document.getElementById("descricao").value,
        tecnico: document.getElementById("tecnico").value,
        status: document.getElementById("status").value,
        data: new Date().toLocaleString(),
        usuario: usuarioId
      };

      if (id) {
        db.ref("ordens/" + id).update(dadosOS);
      } else {
        db.ref("ordens").push(dadosOS);
      }
      document.getElementById("formOS").reset();
      atualizarLista();
    }

    function atualizarLista() {
      db.ref("ordens").orderByChild("usuario").equalTo(usuarioId).once("value", (snapshot) => {
        const lista = document.getElementById("listaOrdens");
        lista.innerHTML = "";
        const tecnicoFiltro = document.getElementById("filtroTecnico").value.toLowerCase();
        const statusFiltro = document.getElementById("filtroStatus").value;

        snapshot.forEach(child => {
          const os = child.val();
          const key = child.key;

          if (
            (tecnicoFiltro === '' || os.tecnico.toLowerCase().includes(tecnicoFiltro)) &&
            (statusFiltro === '' || os.status === statusFiltro)
          ) {
            const li = document.createElement("li");
            li.innerHTML = `
              <strong>${os.cliente}</strong> (${os.tecnico})<br>
              ${os.descricao}<br>
              <em>${os.data} - ${os.status}</em><br>
              <button onclick="editarOrdem('${key}', ${JSON.stringify(os).replace(/"/g, '&quot;')})">Editar</button>
              <button onclick="excluirOrdem('${key}')">Excluir</button>
            `;
            lista.appendChild(li);
          }
        });
      });
    }

    function editarOrdem(id, os) {
      document.getElementById("osId").value = id;
      document.getElementById("cliente").value = os.cliente;
      document.getElementById("descricao").value = os.descricao;
      document.getElementById("tecnico").value = os.tecnico;
      document.getElementById("status").value = os.status;
    }

    function excluirOrdem(id) {
      if (confirm("Deseja excluir esta ordem?")) {
        db.ref("ordens/" + id).remove();
        atualizarLista();
      }
    }
  </script>
</body>
</html>
