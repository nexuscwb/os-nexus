<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OS Nexus com Firebase</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #00458C;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    #loginSection, #appSection {
      background: #fff;
      color: #000;
      padding: 30px;
      border-radius: 12px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input, textarea, select {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #F58220;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #d96d00;
    }
    ul {
      margin-top: 30px;
      padding: 0;
      list-style-type: none;
    }
    li {
      background: #f0f0f0;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 6px;
      color: #000;
    }
    .hidden {
      display: none;
    }
    .logo {
      width: 200px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <img src="logo-nexus.jpg" alt="Logo Nexus" class="logo" />
  <div id="loginSection">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Senha" required />
    <button onclick="login()">Entrar</button>
    <button onclick="resetarSenha()">Esqueci a Senha</button>
  </div>

  <div id="appSection" class="hidden">
    <button onclick="logout()">Sair</button>

    <h2>Nova Ordem</h2>
    <form id="formOS" onsubmit="event.preventDefault(); salvarOuAtualizarOrdem();">
      <input type="hidden" id="osId" />
      <label>Cliente:</label>
      <input type="text" id="cliente" required />
      <label>Descrição:</label>
      <textarea id="descricao" required></textarea>
      <label>Técnico:</label>
      <input type="text" id="tecnico" required />
      <label>Status:</label>
      <select id="status">
        <option value="pendente">Pendente</option>
        <option value="em_andamento">Em andamento</option>
        <option value="concluida">Concluída</option>
      </select>
      <button type="submit">Salvar</button>
    </form>

    <h2>Filtros</h2>
    <input type="text" id="filtroTecnico" placeholder="Filtrar por técnico" oninput="atualizarLista()" />
    <select id="filtroStatus" onchange="atualizarLista()">
      <option value="">Todos os status</option>
      <option value="pendente">Pendente</option>
      <option value="em_andamento">Em andamento</option>
      <option value="concluida">Concluída</option>
    </select>

    <h2>Ordens</h2>
    <ul id="listaOrdens"></ul>
  </div>

  <!-- Firebase Modular v9 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.24.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/9.24.0/firebase-auth.js";
    import { getDatabase, ref, push, update, remove, get } from "https://www.gstatic.com/firebasejs/9.24.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDl44w_xRjnOO3yz7zs0HeBTTfeifGIoP8",
      authDomain: "database-nexus.firebaseapp.com",
      databaseURL: "https://database-nexus-default-rtdb.firebaseio.com",
      projectId: "database-nexus",
      storageBucket: "database-nexus.appspot.com",
      messagingSenderId: "1023176085014",
      appId: "1:1023176085014:web:ce58a963e9cb5298012f37",
      measurementId: "G-KXFVK6PD48"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();
    const db = getDatabase();

    let usuarioId = null;
    let emailUsuario = null;
    let isAdmin = false;

    onAuthStateChanged(auth, user => {
      if (user) {
        usuarioId = user.uid;
        emailUsuario = user.email;
        isAdmin = emailUsuario.endsWith("@nexus.com") || emailUsuario === "admin@nexus.com";
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        document.getElementById('formOS').style.display = isAdmin ? 'block' : 'none';
        atualizarLista();
      } else {
        usuarioId = null;
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('appSection').classList.add('hidden');
      }
    });

    window.login = () => {
      const email = document.getElementById('email').value;
      const senha = document.getElementById('password').value;
      signInWithEmailAndPassword(auth, email, senha)
        .catch(error => alert("Erro no login: " + error.message));
    };

    window.resetarSenha = () => {
      const email = document.getElementById('email').value;
      if (!email) return alert("Digite o e-mail para redefinir.");
      sendPasswordResetEmail(auth, email)
        .then(() => alert("E-mail enviado."))
        .catch(error => alert("Erro: " + error.message));
    };

    window.logout = () => signOut(auth);

    window.salvarOuAtualizarOrdem = () => {
      const id = document.getElementById("osId").value;
      const dadosOS = {
        cliente: document.getElementById("cliente").value,
        descricao: document.getElementById("descricao").value,
        tecnico: document.getElementById("tecnico").value,
        status: document.getElementById("status").value,
        data: new Date().toLocaleString(),
        usuario: usuarioId
      };

      if (id) {
        update(ref(db, "ordens/" + id), dadosOS);
      } else {
        push(ref(db, "ordens"), dadosOS);
      }

      document.getElementById("formOS").reset();
      atualizarLista();
    };

    window.atualizarLista = () => {
      const tecnicoFiltro = document.getElementById("filtroTecnico").value.toLowerCase();
      const statusFiltro = document.getElementById("filtroStatus").value;
      const lista = document.getElementById("listaOrdens");
      lista.innerHTML = "";

      get(ref(db, "ordens")).then(snapshot => {
        snapshot.forEach(child => {
          const os = child.val();
          const key = child.key;
          if (
            (tecnicoFiltro === '' || os.tecnico.toLowerCase().includes(tecnicoFiltro)) &&
            (statusFiltro === '' || os.status === statusFiltro)
          ) {
            const li = document.createElement("li");
            li.innerHTML = `
              <strong>${os.cliente}</strong> (${os.tecnico})<br>
              ${os.descricao}<br>
              <em>${os.data} - ${os.status}</em><br>
              ${isAdmin ?
                `<button onclick="editarOrdem('${key}', ${JSON.stringify(os).replace(/"/g, '&quot;')})">Editar</button>
                 <button onclick="excluirOrdem('${key}')">Excluir</button>` :
                `<button onclick="editarOrdem('${key}', ${JSON.stringify(os).replace(/"/g, '&quot;')})">Preencher Observações</button>`}
            `;
            lista.appendChild(li);
          }
        });
      });
    };

    window.editarOrdem = (id, os) => {
      document.getElementById("osId").value = id;
      document.getElementById("cliente").value = os.cliente;
      document.getElementById("descricao").value = os.descricao;
      document.getElementById("tecnico").value = os.tecnico;
      document.getElementById("status").value = os.status;

      const statusSelect = document.getElementById("status");
      if (!isAdmin) {
        document.getElementById("cliente").disabled = true;
        document.getElementById("tecnico").disabled = true;
        document.getElementById("descricao").disabled = false;
        statusSelect.innerHTML = `
          <option value="cancelado">Cancelado</option>
          <option value="entregue">Entregue</option>`;
      } else {
        document.getElementById("cliente").disabled = false;
        document.getElementById("tecnico").disabled = false;
        document.getElementById("descricao").disabled = false;
        statusSelect.innerHTML = `
          <option value="pendente">Pendente</option>
          <option value="em_andamento">Em andamento</option>
          <option value="concluida">Concluída</option>`;
      }
    };

    window.excluirOrdem = (id) => {
      if (isAdmin && confirm("Deseja excluir esta ordem?")) {
        remove(ref(db, "ordens/" + id));
        atualizarLista();
      }
    };
  </script>
</body>
</html>
